[build-system]
requires = ["setuptools>=61.0", "setuptools-scm[toml]>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-ocpp-relay"
dynamic = ["version"]
description = "OCPP relay with Home Assistant native integration."
authors = [{ name = "Michael Adler" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "paho-mqtt>=2.1.0",
  "pyyaml>=6.0",
  "websockets>=15.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
]

[project.scripts]
ocpp-relay-server = "relay_server.ocpp_relay_server:main"
ocpp-snoop2mqtt = "relay_server.ocpp_snoop2mqtt:main"
ocpp-snoop-recorder = "relay_server.debug.snoop_recorder:main"
ocpp-playback-server = "relay_server.debug.snoop_playback:main"

[tool.setuptools.packages.find]
where = ["."]
namespaces = true
include = [
  "relay_server",
  "relay_server.*",
  "custom_components.ha_ocpp_relay",
  "custom_components.ha_ocpp_relay.*",
]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
