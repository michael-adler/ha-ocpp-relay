name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.1 without v prefix)"
        required: true
      prerelease:
        description: "Mark as pre-release?"
        type: boolean
        default: false

concurrency:
  group: sync-manifest-version-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.version }}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version '$version' does not look like semver" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update manifest version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("custom_components/ha_ocpp_relay/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = "${{ steps.version.outputs.version }}"
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- custom_components/ha_ocpp_relay/manifest.json; then
            echo "No changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custom_components/ha_ocpp_relay/manifest.json
            git commit -m "chore(release): sync manifest version to ${{ steps.version.outputs.version }}"
            git push
          fi

      - name: Tag the release commit
        shell: bash
        run: |
          set -euo pipefail
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Build release body
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            echo "body=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          repo="${{ github.repository }}"
          current_tag="v${{ steps.version.outputs.version }}"
          releases_api="https://api.github.com/repos/${repo}/releases?per_page=100"

          previous_tag=$(curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "$releases_api" \
            | jq -r --arg current "$current_tag" '
                [.[]
                | select(.draft | not)
                | select(.prerelease | not)
                | select(.tag_name != $current)]
                | sort_by(.published_at)
                | reverse
                | .[0].tag_name // empty
              ')

          if [[ -z "$previous_tag" ]]; then
            echo "body=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          compare_url="https://github.com/${repo}/compare/${previous_tag}...${current_tag}"
          {
            echo "body<<EOF"
            echo "**Diff**: ${compare_url}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.release_meta.outputs.body }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}