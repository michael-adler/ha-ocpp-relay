name: Sync Manifest Version

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to write to manifest.json (e.g. 0.2.1)"
        required: false

concurrency:
  group: sync-manifest-version-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-version:
    if: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.version || '' }}" ]]; then
            version="${{ github.event.inputs.version }}"
          elif [[ -n "${{ github.event.release.tag_name || '' }}" ]]; then
            version="${{ github.event.release.tag_name }}"
          else
            echo "Could not determine version" >&2
            exit 1
          fi

          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version '$version' does not look like semver" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update manifest version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("custom_components/ha_ocpp_relay/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = "${{ steps.version.outputs.version }}"
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- custom_components/ha_ocpp_relay/manifest.json; then
            echo "No changes needed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ha_ocpp_relay/manifest.json
          git commit -m "chore(release): sync manifest version to ${{ steps.version.outputs.version }}"
          git push
