name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies and start Mosquitto on port 8583
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          # stop system mosquitto to avoid port conflicts, then start a dedicated instance on 8583
          sudo systemctl stop mosquitto || true
          sudo pkill mosquitto || true
          mosquitto -p 8583 -d

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'

      - name: Wait for Mosquitto on port 8583
        run: |
          for i in {1..10}; do
            nc -z localhost 8583 && break || sleep 1
          done

      - name: Run tests
        run: |
          pytest -q
