name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies and start Mosquitto on port 8583
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          # stop system mosquitto to avoid port conflicts, then start a dedicated instance on 8583
          sudo systemctl stop mosquitto || true
          sudo pkill mosquitto || true
          mosquitto -p 8583 -d

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Pick pytest-homeassistant-custom-component version with a stable HA core
        id: ha_test_version
        run: |
          version=$(python3 .github/scripts/pick_ha_test_version.py)
          echo "Selected pytest-homeassistant-custom-component==$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev,ha-test]' \
            "pytest-homeassistant-custom-component==${{ steps.ha_test_version.outputs.version }}"

      - name: Wait for Mosquitto on port 8583
        run: |
          for i in {1..10}; do
            nc -z localhost 8583 && break || sleep 1
          done

      - name: Run tests
        run: |
          pytest -q -rP
